[package]
name = "server-rigel-rs"
version = "0.1.0"
edition = "2024"

[dependencies]
tokio = { version = "1.52.3", features = ["full"] }
axum = { version = "0.8.9", features = ["multipart", "ws"] }
sqlx = { version = "0.8.6", features = ["runtime-tokio-rustls", "any", "mysql", "sqlite", "macros", "chrono"] }
image = "0.25.10"
dotenvy = "0.15.7"
uuid = { version = "1.23.1", features = ["v4"] }
zstd = "0.13.3"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
serde = { version = "1.0.228", features = ["derive"] }
tower-http = { version = "0.6.11", features = ["cors"] }
chrono = { version = "0.4.38", features = ["serde"] }
bcrypt = "0.19.1"
base64 = "0.22.1"
hmac = "0.13.0"
sha2 = "0.11.0"
serde_json = "1.0.149"
bitflags = "2.11.1"